# 版本 2：不需要 Langfuse 或 ClickHouse 采集配置。所有相对路径相对本 YAML。
version: 2
experiment_id: proxy-tools-v1
dataset: ../dataset/tasks/tool_call_eval_v1.jsonl
run_manifest: bridge-runs.example.json
results_dir: ../results
claude_binary: /home/liukuan/.npm-global/bin/claude
model: deepseek-v4-flash[1m]
timeout_ms: 300000
variants:
  baseline:
    proxy_base_url: http://127.0.0.1:8096/claude-code/rhino-ab
    observation_dir: /storage1/liukuan/tencentdb-memory-lab/baseline/run/tool-observations
    env_file: /storage1/liukuan/tencentdb-memory-lab/baseline/secrets/claude.env
    auth_key_file: /storage1/liukuan/tencentdb-memory-lab/baseline/secrets/memory-user.key
  native:
    proxy_base_url: http://127.0.0.1:18096/claude-code/rhino-ab
    observation_dir: /storage1/liukuan/tencentdb-memory-lab/native/run/tool-observations
    env_file: /storage1/liukuan/tencentdb-memory-lab/native/secrets/claude.env
    auth_key_file: /storage1/liukuan/tencentdb-memory-lab/native/secrets/memory-user.key

